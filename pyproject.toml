[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoteroconv"
version = "0.4.0"
description = "Convert numeric .docx citations into live Zotero Word fields (ADDIN ZOTERO_ITEM / ZOTERO_BIBL + ZOTERO_PREF_* properties)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "lxml>=5.0",
    "python-docx>=1.1",
    "requests>=2.31",
    "rapidfuzz>=3.0",
    "typer>=0.12",
    "citeproc-py>=0.11.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
zoteroconv = "zoteroconv.cli:main"
zoteroconv-validate = "zoteroconv.validate:main_entry"

[tool.setuptools]
packages = ["zoteroconv"]
